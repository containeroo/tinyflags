---
name: Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "Makefile"
      - "bin/dev-tools.mk"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "Makefile"
      - "bin/dev-tools.mk"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build static documentation
        env:
          GH_TOKEN: ${{ github.token }}
        run: make build-docs

      - name: Verify static output
        run: |
          test -s docs/site/index.html
          test -s docs/site/assets/css/app.css
          test -s docs/site/assets/js/static.js
          test -s docs/site/search-index.json
          test -s docs/site/sitemap.xml
          test -s docs/site/robots.txt
          test -f docs/site/.nojekyll
          for page in getting-started flags commands parsing environment dynamic-flags validation groups overrides reference examples; do
            test -s "docs/site/$page/index.html"
          done

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
